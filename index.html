<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK ELO | PREMIUM ACCESS</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #000000; 
            --accent: #ff0000;
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #0f172a;
            --discord: #5865F2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body { 
            background-color: var(--bg);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            perspective: 1000px;
        }

        .card { 
            background: var(--card); 
            padding: 40px 30px; 
            border-radius: 32px; 
            text-align: center; 
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .top-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .badge {
            font-size: 9px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-online { background: #dcfce7; color: #16a34a; }
        .badge-secure { background: #fee2e2; color: #dc2626; }

        .welcome-text {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 5px;
            animation: fadeInDown 0.8s ease;
        }

        .brand { 
            font-weight: 800; 
            font-size: 34px; 
            letter-spacing: -2px; 
            color: var(--primary);
            margin-bottom: 25px;
        }
        .brand span { color: var(--accent); }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-gen {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
        }

        .btn-gen:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }

        .btn-gen:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-discord {
            background: #fff;
            color: var(--discord);
            border: 2px solid var(--discord);
        }

        .btn-discord:hover {
            background: var(--discord);
            color: #fff;
        }

        #result-area {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f1f5f9;
            border-radius: 24px;
            border: 2px dashed #cbd5e0;
            animation: slideUp 0.5s ease;
        }

        .data-label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .data-value { font-size: 22px; font-weight: 800; color: #000; margin-bottom: 15px; }

        .footer-info {
            margin-top: 25px;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Fix */
        @media (max-width: 400px) {
            .card { padding: 30px 20px; }
            .brand { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="top-badges">
            <span class="badge badge-online"><i class="fas fa-circle"></i> Server Live</span>
            <span class="badge badge-secure"><i class="fas fa-shield-alt"></i> Anti-Ban</span>
        </div>

        <div class="welcome-text">Hi, Welcome back!</div>
        <div class="brand">DARK<span>ELO</span></div>
        
        <button id="genBtn" onclick="generateTrial()" class="btn btn-gen" disabled>
            <i class="fas fa-key"></i> VERIFYING...
        </button>

        <a href="https://discord.gg/bczx5sGtdT" target="_blank" class="btn btn-discord">
            <i class="fab fa-discord"></i> JOIN DISCORD
        </a>

        <div id="result-area">
            <div class="data-label">Trial Username</div>
            <div id="userD" class="data-value"></div>
            <div class="data-label">Trial Password</div>
            <div id="passD" class="data-value" style="margin-bottom:0;"></div>
        </div>

        <div class="footer-info">
            <i class="far fa-clock"></i> Valid for: 24 Hours Access
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC0VsVrG4T7sEl7nZ4Zd-7OigtKWI3smvA",
        databaseURL: "https://codkhang-c8cb8-default-rtdb.firebaseio.com",
        projectId: "codkhang-c8cb8",
        appId: "1:411020704482:web:861786dd37783eb8d4fcbb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const auth = urlParams.get('auth');
    const btn = document.getElementById('genBtn');

    onValue(ref(db, 'settings/public_gen'), (snap) => {
        const status = snap.val();
        if (status === "off") {
            btn.disabled = true;
            btn.innerText = "LINK EXPIRED";
        } else {
            if (auth === 'khangvip') {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> GENERATE TRIAL';
            } else {
                btn.innerText = "NOT AUTHORIZED";
                btn.disabled = true;
            }
        }
    });

    window.generateTrial = async () => {
        btn.disabled = true;
        btn.innerText = "FETCHING KEY...";

        try {
            const user = "DARK-" + Math.floor(1000 + Math.random() * 8999);
            const pass = Math.floor(100 + Math.random() * 899).toString();
            
            let exp = new Date(); 
            exp.setHours(exp.getHours() + 24); 
            const expiryTimestamp = exp.getTime();

            const data = {
                username: user,
                password: pass,
                status: "active",
                validity: expiryTimestamp,
                type: "trial",
                device: "null"
            };

            await set(ref(db, `userinfo/${user}`), data);
            await set(ref(db, `trial_users/${user}`), data);

            document.getElementById('result-area').style.display = "block";
            document.getElementById('userD').innerText = user;
            document.getElementById('passD').innerText = pass;
            
            navigator.clipboard.writeText(`USER: ${user}\nPASS: ${pass}`);
            
            Swal.fire({
                title: 'SUCCESS!',
                text: 'Your 24H Trial Key is Ready & Copied!',
                icon: 'success',
                confirmButtonColor: '#000',
                background: '#fff'
            });
            
            btn.innerHTML = '<i class="fas fa-check-circle"></i> KEY GENERATED';

        } catch (e) {
            Swal.fire({ title: 'Error', text: 'Connection Failed!', icon: 'error' });
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
