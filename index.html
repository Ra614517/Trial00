<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK ELO | PREMIUM ACCESS</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #000000; 
            --accent: #ff0000;
            --bg: #fdfdfd; 
            --discord: #5865F2;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
            background-image: 
                radial-gradient(circle at 2px 2px, #ebebeb 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Premium Card Design */
        .card { 
            width: 100%; max-width: 420px; 
            background: var(--card-bg); 
            padding: 50px 35px; 
            border-radius: 45px; 
            text-align: center; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.08); 
            border: 1px solid rgba(0,0,0,0.03); 
            position: relative;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 50px 120px rgba(0,0,0,0.12); }

        /* Badge Styling */
        .badge-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .badge { 
            font-size: 10px; font-weight: 800; padding: 6px 16px; 
            border-radius: 100px; text-transform: uppercase; letter-spacing: 1.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .badge-live { background: #e8fff3; color: #10b981; }
        .badge-pro { background: #fff1f2; color: #e11d48; }

        .welcome-sub { font-size: 14px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
        
        /* Branding */
        .brand { 
            font-weight: 800; font-size: 42px; letter-spacing: -2.5px; 
            margin-bottom: 40px; color: var(--primary); 
            line-height: 1;
        }
        .brand span { color: var(--accent); position: relative; }
        .brand span::after {
            content: ''; position: absolute; bottom: -5px; left: 0;
            width: 100%; height: 4px; background: var(--accent); border-radius: 10px;
            opacity: 0.2;
        }

        /* Buttons */
        .btn { 
            width: 100%; padding: 20px; border-radius: 24px; font-weight: 800; font-size: 16px; 
            cursor: pointer; transition: 0.4s; border: none; 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            margin-bottom: 16px; text-decoration: none; 
        }

        .btn-gen { 
            background: var(--primary); color: #fff; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); 
        }
        .btn-gen:hover:not(:disabled) { transform: scale(1.02); background: #222; }
        .btn-gen:disabled { background: #f1f5f9; color: #cbd5e0; cursor: not-allowed; box-shadow: none; }

        .btn-discord { 
            background: #fff; color: var(--discord); 
            border: 2.5px solid var(--discord); 
        }
        .btn-discord:hover { background: var(--discord); color: #fff; transform: scale(1.02); }

        /* Key Area Styling */
        #key-box { 
            display: none; margin-top: 35px; padding: 30px; 
            background: #fcfdfe; border-radius: 32px; 
            border: 2px dashed #e2e8f0; 
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .k-label { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .k-value { font-size: 28px; font-weight: 800; color: #000; margin-bottom: 25px; letter-spacing: 1.5px; }

        .footer-tag { margin-top: 30px; font-size: 12px; color: #cbd5e0; font-weight: 700; letter-spacing: 0.5px; }

        /* Responsive Mobile Fixes */
        @media (max-width: 480px) {
            .card { padding: 40px 25px; border-radius: 35px; }
            .brand { font-size: 36px; }
            .btn { padding: 18px; font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge-container">
        <div class="badge badge-live"><i class="fas fa-bolt"></i> Active</div>
        <div class="badge badge-pro"><i class="fas fa-crown"></i> Premium</div>
    </div>

    <div class="welcome-sub">Welcome to Official</div>
    <div class="brand">DARK<span>ELO</span></div>
    
    <button id="genBtn" onclick="generateTrial()" class="btn btn-gen" disabled>
        <i class="fas fa-fingerprint"></i> VERIFYING...
    </button>

    <a href="https://discord.gg/bczx5sGtdT" target="_blank" class="btn btn-discord">
        <i class="fab fa-discord"></i> JOIN DISCORD
    </a>

    <div id="key-box">
        <div class="k-label">Username</div>
        <div id="userD" class="k-value"></div>
        <div class="k-label">Password</div>
        <div id="passD" class="k-value" style="margin-bottom:0;"></div>
    </div>

    <div class="footer-tag">
        <i class="far fa-clock"></i> 24 HOURS TRIAL SYSTEM
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC0VsVrG4T7sEl7nZ4Zd-7OigtKWI3smvA",
        databaseURL: "https://codkhang-c8cb8-default-rtdb.firebaseio.com",
        projectId: "codkhang-c8cb8",
        appId: "1:411020704482:web:861786dd37783eb8d4fcbb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const auth = urlParams.get('auth');
    const btn = document.getElementById('genBtn');

    // Authority save garne taaki URL clean huda pani kaam garos
    let isAuthorized = (auth === 'khangvip');

    if (isAuthorized) {
        // SECURITY: URL bata ?auth=khangvip hataune
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    onValue(ref(db, 'settings/public_gen'), (snap) => {
        const status = snap.val();
        if (status === "off") {
            btn.disabled = true;
            btn.innerText = "ACCESS CLOSED";
        } else {
            if (isAuthorized) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> GENERATE KEY';
            } else {
                btn.innerText = "ACCESS DENIED";
                btn.disabled = true;
                Swal.fire({ title: 'UNAUTHORIZED', text: 'Please use the official link!', icon: 'error', confirmButtonColor: '#000', background: '#fff' });
            }
        }
    });

    window.generateTrial = async () => {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GENERATING...';
        try {
            const user = "DARK-" + Math.floor(1000 + Math.random() * 8999);
            const pass = Math.floor(100 + Math.random() * 899).toString();
            
            let exp = new Date(); 
            exp.setHours(exp.getHours() + 24); 
            const expiryTimestamp = exp.getTime();

            const data = { 
                username: user, 
                password: pass, 
                status: "active", 
                validity: expiryTimestamp, 
                type: "trial", 
                device: "null" 
            };

            await set(ref(db, `userinfo/${user}`), data);
            await set(ref(db, `trial_users/${user}`), data);

            document.getElementById('key-box').style.display = "block";
            document.getElementById('userD').innerText = user;
            document.getElementById('passD').innerText = pass;
            
            navigator.clipboard.writeText(`USER: ${user}\nPASS: ${pass}`);
            
            Swal.fire({ 
                title: 'SUCCESS', 
                text: 'Key Generated & Copied to Clipboard!', 
                icon: 'success', 
                confirmButtonColor: '#000' 
            });
            
            btn.innerHTML = '<i class="fas fa-check-circle"></i> KEY READY';

        } catch (e) {
            Swal.fire({ title: 'ERROR', text: 'Firebase Error!', icon: 'error' });
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
