<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK ELO | PREMIUM TRIAL</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #000000; 
            --accent: #ff0000;
            --bg: #f0f4f8; 
            --card: #ffffff; 
            --discord: #5865F2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* Responsive Container */
        .wrapper {
            width: 90%;
            max-width: 400px;
            padding: 20px 0;
        }

        .premium-card { 
            background: var(--card); 
            padding: 40px 25px; 
            border-radius: 35px; 
            text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.8);
            position: relative;
            transition: all 0.4s ease;
        }

        /* Status Header */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .status-chip {
            font-size: 10px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 50px;
            text-transform: uppercase;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        .online { color: #10b981; border-color: #10b981; }

        .welcome-note {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .brand-title { 
            font-weight: 800; 
            font-size: 36px; 
            letter-spacing: -2px; 
            color: var(--primary);
            margin-bottom: 30px;
        }
        .brand-title span { color: var(--accent); }

        /* Action Buttons */
        .btn-main {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-generate { background: var(--primary); color: #fff; }
        .btn-generate:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .btn-generate:disabled { background: #cbd5e0; cursor: not-allowed; box-shadow: none; }

        .btn-discord { 
            background: #fff; 
            color: var(--discord); 
            border: 2px solid var(--discord);
            text-decoration: none;
        }
        .btn-discord:hover { background: var(--discord); color: #fff; }

        /* Key Display Area */
        #key-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 25px;
            border: 2px dashed #cbd5e0;
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 0.9; transform: scale(1.1); }
            80% { opacity: 1; transform: scale(0.89); }
            100% { opacity: 1; transform: scale(1); }
        }

        .key-label { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .key-value { font-size: 24px; font-weight: 800; color: #000; margin-bottom: 20px; letter-spacing: 1px; }

        .validity-tag {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            margin-top: 20px;
        }

        /* Small screen adjustment */
        @media (max-width: 360px) {
            .brand-title { font-size: 28px; }
            .premium-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="premium-card">
        <div class="status-bar">
            <span class="status-chip online"><i class="fas fa-bolt"></i> System Live</span>
            <span class="status-chip"><i class="fas fa-shield-halved"></i> 100% Safe</span>
        </div>

        <span class="welcome-note">Authorized Access Only</span>
        <h1 class="brand-title">DARK<span>ELO</span></h1>
        
        <button id="genBtn" onclick="generateTrial()" class="btn-main btn-generate" disabled>
            <i class="fas fa-sync fa-spin"></i> VERIFYING...
        </button>

        <a href="https://discord.gg/bczx5sGtdT" target="_blank" class="btn-main btn-discord">
            <i class="fab fa-discord"></i> JOIN DISCORD
        </a>

        <div id="key-box">
            <div class="key-label">User ID</div>
            <div id="userD" class="key-value"></div>
            <div class="key-label">Access Key</div>
            <div id="passD" class="key-value" style="margin-bottom:0;"></div>
        </div>

        <div class="validity-tag">
            <i class="far fa-clock"></i> Lifetime Validity: 24 Hours
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC0VsVrG4T7sEl7nZ4Zd-7OigtKWI3smvA",
        databaseURL: "https://codkhang-c8cb8-default-rtdb.firebaseio.com",
        projectId: "codkhang-c8cb8",
        appId: "1:411020704482:web:861786dd37783eb8d4fcbb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const auth = urlParams.get('auth');
    const btn = document.getElementById('genBtn');

    // UI lai sabai case ma dammi banauna logic
    onValue(ref(db, 'settings/public_gen'), (snap) => {
        const status = snap.val();
        if (status === "off") {
            btn.disabled = true;
            btn.innerText = "ACCESS CLOSED";
        } else {
            // Check if auth is correct, if not UI still stays dammi but btn disabled
            if (auth === 'khangvip') {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> GENERATE KEY';
            } else {
                btn.innerText = "AUTH REQUIRED";
                btn.disabled = true;
                Swal.fire({ title: 'AUTH ERROR', text: 'Invalid Security Token!', icon: 'warning', confirmButtonColor: '#000' });
            }
        }
    });

    window.generateTrial = async () => {
        btn.disabled = true;
        btn.innerText = "CREATING ACCESS...";

        try {
            const user = "DARK-" + Math.floor(1000 + Math.random() * 8999);
            const pass = Math.floor(100 + Math.random() * 899).toString();
            
            let exp = new Date(); 
            exp.setHours(exp.getHours() + 24); 
            const expiryTimestamp = exp.getTime();

            const data = {
                username: user,
                password: pass,
                status: "active",
                validity: expiryTimestamp,
                type: "trial",
                device: "null"
            };

            await set(ref(db, `userinfo/${user}`), data);
            await set(ref(db, `trial_users/${user}`), data);

            document.getElementById('key-box').style.display = "block";
            document.getElementById('userD').innerText = user;
            document.getElementById('passD').innerText = pass;
            
            navigator.clipboard.writeText(`USER: ${user}\nPASS: ${pass}`);
            
            Swal.fire({
                title: 'SUCCESS',
                text: 'Key Generated & Copied to Clipboard!',
                icon: 'success',
                confirmButtonColor: '#000'
            });
            
            btn.innerHTML = '<i class="fas fa-check"></i> READY TO USE';

        } catch (e) {
            Swal.fire({ title: 'ERROR', text: 'Database Busy!', icon: 'error' });
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
